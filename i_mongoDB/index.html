<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB | SSMS Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mongo-green: #00ED64;
      --mongo-dark: #001E2B;
      --bg: #F4F7F6;
      --card-bg: #FFFFFF;
      --text: #333333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--mongo-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text); }
    .wrapper { display: flex; width: 900px; background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .display-panel { flex: 1; background: linear-gradient(135deg, #00ED64, #00A63F); padding: 50px; display: flex; flex-direction: column; justify-content: center; color: white; text-align: center; }
    .display-panel h2 { font-size: 32px; margin-bottom: 20px; font-weight: 700; color: #001E2B; }
    .display-panel p { font-size: 16px; opacity: 0.9; color: #001E2B; }
    .forms-panel { flex: 1; padding: 50px; display: flex; flex-direction: column; gap: 40px; }
    .form-box h3 { font-size: 24px; color: var(--mongo-dark); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: 0.3s; background: #f9f9f9; }
    .form-group input:focus { border-color: var(--mongo-green); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(0,237,100,0.2); }
    .btn { width: 100%; padding: 12px; background: var(--mongo-dark); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn:hover { background: #000; transform: translateY(-2px); }
    .divider { height: 1px; background: #eee; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="display-panel">
      <h2>MERN/LAMP Stack Auth</h2>
      <p>Powered by MongoDB Atlas & local integration mapping structurally over PHP.</p>
    </div>
    <div class="forms-panel">
      <!-- Login -->
      <div class="form-box">
        <h3>System Login</h3>
        <form action="login.php" method="POST">
          <div class="form-group"><input type="email" name="email" placeholder="Email Address" required></div>
          <div class="form-group"><input type="password" name="password" placeholder="Secure Password" required></div>
          <button type="submit" class="btn">Login</button>
        </form>
      </div>
      <div class="divider"></div>
      <!-- Signup -->
      <div class="form-box">
        <h3>Create an Account</h3>
        <form action="signup.php" method="POST">
          <div class="form-group"><input type="email" name="email" placeholder="Email Address" required></div>
          <div class="form-group"><input type="password" name="password" placeholder="Create Password" required></div>
          <button type="submit" class="btn" style="background:var(--mongo-green); color:var(--mongo-dark);">Signup</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
